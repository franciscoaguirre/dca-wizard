# Chopsticks configuration for Polkadot Asset Hub
# Start with: npx @acala-network/chopsticks@latest --config test/chopsticks/asset-hub.yml

endpoint:
  - wss://polkadot-asset-hub-rpc.polkadot.io
  - wss://statemint-rpc.dwellir.com
mock-signature-host: true
db: ./test/chopsticks/db/asset-hub.db
port: 8000

import-storage:
  System:
    Account:
      # Fund Alice (dev account)
      - - - 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY
        - providers: 1
          data:
            free: '100000000000000000' # 10,000,000 DOT
      # Fund Treasury account
      - - - 13UVJyLnbVp9RBZYFwFGyDvVd1y27Tt8tkntv6Q7JVPhFsTB
        - providers: 1
          data:
            free: '100000000000000000' # 10,000,000 DOT
  Assets:
    Account:
      # Give Alice USDT (asset 1984)
      - [[1984, 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY], { balance: '100000000000' }] # 100,000 USDT
      # Give Alice USDC (asset 1337)
      - [[1337, 5GrwvaEF5zXb26Fz9rcQpDWS57CtERHpNehXCPcNoHGKutQY], { balance: '100000000000' }] # 100,000 USDC
      # Give Treasury USDT
      - [[1984, 13UVJyLnbVp9RBZYFwFGyDvVd1y27Tt8tkntv6Q7JVPhFsTB], { balance: '100000000000000' }] # 100,000,000 USDT
      # Give Treasury USDC
      - [[1337, 13UVJyLnbVp9RBZYFwFGyDvVd1y27Tt8tkntv6Q7JVPhFsTB], { balance: '100000000000000' }] # 100,000,000 USDC
